<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Inquiry: Energy in Chemical Reactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{background:var(--teal);color:#fff;padding:30px 34px 28px;margin:24px 0 10px}
header.top .eyebrow{font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:10px}
header.top h1{margin:0;font-size:46px;font-weight:500;line-height:1.12}
header.top .sub{font-size:17px;opacity:.95;margin-top:12px}
header.top .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
header.top .tags span{border:1px solid rgba(255,255,255,.75);border-radius:999px;padding:2px 9px;font-size:13px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;font-weight:600}
nav.tabs button .tk{color:var(--good);font-weight:800;margin-left:4px}
nav.tabs button.on .tk{color:#fff}
section.part{display:none}section.part.on{display:block}
.banner{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;color:var(--body)}
.banner h2{margin:0;background:var(--teal);color:#fff;font-weight:500;font-size:25px;line-height:1.2;padding:11px 22px}
.banner>div{padding:10px 22px 12px}
.banner .time{font-size:13px;color:#6b7782}
.banner p{margin:6px 0}
.lvl{background:#fff;border-left:6px solid #0070C0;border-radius:10px;padding:10px 16px;margin:18px 0 8px}
.lvl h3{margin:0;font-size:19px;font-weight:600;color:#0070C0}
.lvl div{color:var(--body);font-size:16.5px}
.model{background:#fff;border:2px solid var(--ch-bd);border-radius:12px;padding:12px 14px;margin:14px 0}
.model h3{margin:0 0 8px;font-size:19px;font-weight:600;color:var(--teal-ink)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cards.c4{grid-template-columns:repeat(4,1fr)}
.cards.c2{grid-template-columns:1fr 1fr}
.card{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:#fbfdfe}
.card .f{font-size:22px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfdfe}
.panel .nm{font-weight:700}
.panel .eq{font-size:19px;margin:2px 0 4px}
.key{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:15px;color:#5b6b78;margin-top:6px}
.key span.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.1px solid #000;vertical-align:middle;margin-right:4px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;position:relative}
.qh{display:flex;gap:10px;align-items:flex-start}
.qn{flex:0 0 auto;font-weight:600;color:var(--teal-deep);min-width:34px;font-size:var(--g-q)}
.wtag{display:inline-block;background:#fff1d6;color:#8a4b00;border:1px solid #e9c48a;border-radius:6px;font-size:12.5px;font-weight:600;padding:1px 7px;margin-left:8px;vertical-align:middle}
.qp{flex:1;font-size:var(--g-q);font-weight:500}
.qp .ins{display:block;font-size:var(--g-p);font-weight:400;color:#5b6b78;margin-top:2px}
button.chk{flex:0 0 auto;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;cursor:pointer}
button.chk:hover{filter:brightness(1.07)}
.qb{margin:10px 0 0 44px}
.stock{grid-template-columns:1fr 44px 1fr!important;align-items:center}
.stock .arr{font-size:34px;font-weight:500;color:#1b2328;text-align:center}
.fb{margin:8px 0 0 44px;font-size:16.5px}
.fb.ok{color:var(--good);font-weight:600}.fb.no{color:var(--bad)}
.fb .first{color:#6b7782;font-weight:400;font-size:14px;margin-left:6px}
.fb button{margin-left:8px;border:1px solid var(--bad);background:#fff;color:var(--bad);border-radius:6px;padding:2px 8px;cursor:pointer;font:inherit;font-size:13px}
input.n,input.c{width:58px;padding:5px 6px;border:1.5px solid #9aa8b3;border-radius:6px;font:inherit;text-align:center;font-size:16px}
input.c{width:44px}
input.f{width:150px;padding:5px 8px;border:1.5px solid #9aa8b3;border-radius:6px;font:inherit;font-size:17px}
input.t{padding:6px 8px;border:1.5px solid #9aa8b3;border-radius:6px;font:inherit;font-size:17px}
select{padding:5px 6px;border:1.5px solid #9aa8b3;border-radius:6px;font:inherit;font-size:16px;background:#fff;max-width:100%}
.ok{background:var(--good-bg)!important;border-color:var(--good)!important}
.no{background:var(--bad-bg)!important;border-color:var(--bad)!important}
table.tt{border-collapse:collapse;margin:4px 0;font-size:17px}
table.tt th,table.tt td{border:1px solid #b9c6cf;padding:6px 9px;text-align:center}
table.tt th{background:var(--teal);border-color:var(--teal-deep);color:#fff;font-weight:600}
table.tt td.l{text-align:left;font-weight:600;white-space:nowrap}
.els{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.els label{white-space:nowrap}
.frame{font-size:17.5px;line-height:2.3}
.choices{display:flex;flex-wrap:wrap;gap:8px;padding:4px;border-radius:10px;border:1.5px solid transparent}
.choices button{background:var(--ch-bg);border:1.5px solid var(--ch-bd);border-radius:8px;padding:7px 12px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink);text-align:left}
.choices button:hover{background:var(--ch-hov)}
.choices button.sel{background:var(--teal);border-color:var(--teal-deep);color:#fff}
.choices.col{flex-direction:column;align-items:stretch}
.rowpick tr.rp{cursor:pointer}.rowpick tr.rp:hover td{background:var(--ch-hov)}.rowpick tr.pick td{background:var(--teal)!important;color:#fff;font-weight:600}.rowpick.ok{outline:3px solid var(--good);background:none!important}.rowpick.no{outline:3px solid var(--bad);background:none!important}
textarea{width:100%;min-height:76px;padding:8px;border:1.5px solid #9aa8b3;border-radius:8px;font:inherit;font-size:17px;resize:vertical}
.wsave{margin-top:6px;display:flex;gap:10px;align-items:center;font-size:15px;color:#5b6b78}
.wsave button{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:6px 14px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
.rt{border:2px solid var(--teal);border-left-width:8px;background:var(--row);border-radius:12px;padding:12px 18px;margin:14px 0}
.rt h4{margin:0 0 6px;font-size:19px;font-weight:600;color:var(--teal-ink)}
.rt.lock{background:#f4f5f6;border-color:#c9c9c9;color:#777}.rt.lock h4{color:#777}
.rt ul,.rt ol{margin:4px 0;padding-left:22px}
.navb{display:flex;justify-content:space-between;margin:18px 0}
.navb button{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.navb button.back{background:#8a99a5}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tools button{background:#fff;border:1.5px solid var(--teal-deep);color:var(--teal-deep);border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.tools button:hover{background:var(--ch-hov)}
.tools button.sel{background:var(--teal-deep);color:#fff}
.status{font-size:15px;color:#5b6b78}
.bal{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:600;font-size:14px}
.bal.y{background:var(--good-bg);color:var(--good)}.bal.n{background:#eef0f2;color:#6b7782}
.stock{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stock .side h5{margin:2px 0 4px;font-size:15px;text-align:center;color:#5b6b78}
.ctrls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:4px}
.ctrl{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:#fff}

.ctrl .cn{min-width:20px;text-align:center;font-weight:600}.ctrl .cf{font-size:17px}
.eqline{font-size:20px;margin:8px 0;line-height:2.2}
.info{border:1px solid #b9c6cf;border-radius:10px;padding:8px 12px;background:#f7fafc;margin-top:8px;font-size:16.5px}
.start label{display:inline-block;margin:6px 14px 6px 0;font-weight:600}
.howto{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 18px}
.howto li{margin:4px 0}
.sumtab{border-collapse:collapse;width:100%;font-size:15px}
.sumtab td,.sumtab th{border:1px solid #c9d3da;padding:6px 8px;vertical-align:top;text-align:left}

.big{font-size:26px;font-weight:600;color:var(--teal-deep)}

.warn{color:var(--bad);font-weight:600}
.small{font-size:14.5px;color:#5b6b78}

.builder svg{background:#fbfdfe;border:1px solid var(--line);border-radius:10px}
#printsum{display:none}

@media print{body{background:#fff}.wrap>*:not(#printsum){display:none!important}#printsum{display:block!important}}
.eqrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;font-size:19px;margin:6px 0;line-height:1.8}
.eqlab{font-weight:600;font-size:16px;min-width:96px;color:#0e5f72}
.eqx{font-size:16px;color:#4a5257}
.dh{font-style:italic;font-family:"Cambria Math",Cambria,Georgia,serif}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.eqline2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
:root{--g-q:19px;--g-p:16.5px}
.banner p,.model p,.rt p,.rt li{font-size:17px;color:var(--body)}
.frame{font-size:17.5px}
table.tt{font-size:17px}
.choices button{font-size:17px}
.small{font-size:14.5px;color:#5b6b78}
.dh{font-family:"LippOps",Cambria,"Caladea","Cambria Math",serif;font-style:normal;color:var(--ink)}
.eqrow{font-size:18px}
.eqlab{font-size:16px;font-weight:600}
.eqx{font-size:16px}
.build{margin:4px 0}
.bline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:18px;line-height:2.2;margin:4px 0}
.slot{display:inline-flex;min-width:88px;min-height:38px;border:2px dashed #9fc4d6;border-radius:8px;align-items:center;justify-content:center;padding:2px;vertical-align:middle;background:#fff;cursor:pointer}
.slot.filled{border-style:solid;border-color:#9fc4d6}
.slot.ok{border-color:var(--good);background:var(--good-bg)}.slot.no{border-color:var(--bad);background:var(--bad-bg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:#f7fbfd;margin-top:4px}
button.tile{background:var(--ch-bg);border:1.5px solid var(--ch-bd);border-radius:8px;padding:6px 12px;font:inherit;font-size:17px;cursor:grab;color:var(--ink)}
button.tile.sel{background:var(--teal);border-color:var(--teal-deep);color:#fff}
svg.ok{outline:3px solid var(--good);border-radius:8px}svg.no{outline:3px solid var(--bad);border-radius:8px}
.choices.ok{outline:3px solid var(--good);border-radius:8px}.choices.no{outline:3px solid var(--bad);border-radius:8px}
td .choices{flex-wrap:nowrap}
.bbreak{flex-basis:100%;height:4px}.blab{font-weight:600;color:var(--teal-ink);margin-right:4px}

</style>

function solveRep(raw,need,ans,what){what=what||"values";

  if(Math.abs(a)<1e-9){if(Math.abs(f0)>tol)return{ok:false,msg:`The two sides of your equation are not equal. Check which ${what} belong on each side.`};}
  else{const x=-f0/a;if(X!=null&&Math.abs(x-X)>tol)return{ok:false,msg:"Check your equation."};X=x;}}

function compileExpr(src){const tk=src.match(/\d*\.?\d+|[X+\-*/()]/g)||[];let i=0;

const WRITTEN=[["q6w","6. Why the thermometer reading increased","q6"],["q14w","14. Why ΔH is negative","q14"],["q24w","24. Breaking and forming the H–H bond","q24"],["q31w","31. Why burning methane is exothermic","q31"],["q32w","32. Correcting the fuel statement","q32"],["q37a","37. Rule 1 (multiplying)","q37a"],["q37b","37. Rule 2 (reversing)","q37b"]];

function score(){let pts=0;QORDER.forEach(id=>{const r=S.q[id];if(r&&r.first!=null)pts+=r.first;});return{pts:Math.round(pts*100)/100,max:QORDER.length};}
function items(){return QORDER.map(id=>{const r=S.q[id];return id.toUpperCase()+":"+(r&&r.first!=null?r.first:"–");}).join(" ");}
const subBox=h("div");
part("sub","Submit",banner("Submit Your Work","",`<p>Check that your name and period are correct on the Start tab, then submit. Your score is based on your first try at each checked question.</p>`),[subBox]);
function paintSubmit(){
 const sc=score(),missing=QORDER.filter(id=>!(S.q[id]&&S.q[id].tries>0)).map(id=>id.toUpperCase()),wMissing=[...new Set(WRITTEN.filter(([k])=>!(S.v[k]||"").trim()).map(([k,l])=>l.split(".")[0]))];
 const stu=S.stu,okName=stu.first&&stu.last&&stu.period;subBox.innerHTML="";
 subBox.append(h("div",{class:"q"},h("div",null,"Student: ",h("b",null,okName?`${stu.first} ${stu.last}, Period ${stu.period}`:"—"),okName?null:h("span",{class:"warn"}," Enter your name and period on the Start tab.")),
  h("div",{style:"margin-top:6px"},"Score on checked questions: ",h("span",{class:"big"},`${sc.pts} / ${sc.max}`),` (${Math.round(sc.pts/sc.max*100)}%)`),
  missing.length?h("div",{class:"warn",style:"margin-top:6px"},"Not yet answered: "+missing.join(", ")):null,wMissing.length?h("div",{class:"warn"},"Written answers still blank: Question "+wMissing.join(", ")):null,
  h("table",{class:"sumtab",style:"margin-top:10px"},h("tr",null,h("th",null,"Written question"),h("th",null,"Your answer")),WRITTEN.map(([k,l])=>h("tr",null,h("td",{style:"width:32%"},l),h("td",null,S.v[k]||"—"))))));
 const area=h("div",{class:"q"});subBox.append(area);
 if(!okName){area.append(h("div",{class:"warn"},"You must enter your first name, last name and period before submitting."));return;}
 const vals={last:stu.last,first:stu.first,period:String(stu.period),score:String(sc.pts),possible:String(sc.max),percent:String(Math.round(sc.pts/sc.max*100)),items:items(),version:VERSION};WRITTEN.forEach(([k,l,f])=>vals[f]=S.v[k]||"");
 if(GRADEBOOK.formUrl&&GRADEBOOK.fields&&GRADEBOOK.fields.last){
  const qs=Object.entries(GRADEBOOK.fields).map(([k,e])=>e+"="+encodeURIComponent(vals[k]||"")).join("&");const url=GRADEBOOK.formUrl+(GRADEBOOK.formUrl.includes("?")?"&":"?")+"usp=pp_url&"+qs;
  if(url.length<7500)area.append(h("p",null,"Press the green button. A Google Form opens with your answers already filled in. Check your name and period, then press ",h("b",null,"Submit")," on the form."),h("a",{class:"submit",href:url,target:"_blank",rel:"noopener"},"Open my submission form"));
  else{const f=h("form",{method:"POST",action:GRADEBOOK.formUrl.replace(/viewform.*$/,"formResponse"),target:"_blank"});Object.entries(GRADEBOOK.fields).forEach(([k,e])=>f.append(h("input",{type:"hidden",name:e,value:vals[k]||""})));f.append(h("button",{type:"submit",class:"submit"},"Submit my work"));area.append(h("p",null,"Press the green button once. A confirmation page opens when your work is recorded."),f);}
 }else area.append(h("p",{class:"small"},"Your teacher has not connected a gradebook to this activity. Use Print or Copy below to turn in your work."));
 const txt=`${VERSION}\n${stu.first} ${stu.last} — Period ${stu.period}\nScore: ${sc.pts}/${sc.max}\n${items()}\n\n`+WRITTEN.map(([k,l])=>l+":\n"+(S.v[k]||"—")).join("\n\n");
 const ta=h("textarea",{readonly:true,style:"min-height:60px;font-size:12px;margin-top:8px"});ta.value=txt;
 area.append(h("div",{class:"tools",style:"margin-top:12px"},h("button",{type:"button",onclick:()=>{const p=document.getElementById("printsum");p.innerHTML="";p.append(h("h2",null,TITLE),h("pre",{style:"white-space:pre-wrap;font-family:Inter,Arial,sans-serif;font-size:13px"},txt));try{window.print();}catch(e){}}},"Print / Save as PDF"),h("button",{type:"button",onclick:()=>{ta.select();try{document.execCommand("copy");}catch(e){}try{navigator.clipboard.writeText(txt);}catch(e){}}},"Copy my answers")),ta);}

const main=document.getElementById("main"),tabs=document.getElementById("tabs");
PARTS.forEach((p,i)=>{main.append(p.sec);p.sec.append(h("div",{class:"navb"},i?h("button",{type:"button",class:"back",onclick:()=>go(i-1)},"← Back"):h("span"),i<PARTS.length-1?h("button",{type:"button",onclick:()=>go(i+1)},"Next →"):h("span")));});
QORDER.splice(0,QORDER.length,...[...main.querySelectorAll(".q")].map(c=>c.id.slice(2)).filter(id=>QDEF[id]));
function partDone(p){const ids=[...p.sec.querySelectorAll(".q")].map(c=>c.id.slice(2)).filter(id=>QDEF[id]);return ids.length&&ids.every(id=>S.q[id]&&S.q[id].tries>0);}
function paintTabs(){tabs.innerHTML="";PARTS.forEach((p,i)=>tabs.append(h("button",{type:"button",class:i===S.part?"on":"",onclick:()=>go(i)},p.tab,partDone(p)?h("span",{class:"tk"},"✓"):null)));}
function go(i,force){if(!force&&S.part===0&&i>0&&!(S.stu.first&&S.stu.last&&S.stu.period)){const w=document.getElementById("p-start").querySelector(".start");if(!w.querySelector(".warn"))w.append(h("div",{class:"warn"},"Enter your first name, last name and period to begin."));return;}
